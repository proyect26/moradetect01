<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Berry Gradients -->
    <linearGradient id="berryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Brain Circuit AI Gradient -->
    <linearGradient id="aiBrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stem -->
  <path d="M 256 50 C 265 80 275 110 256 125 C 248 110 245 80 256 50 Z" fill="#4c1d95" stroke="#a855f7" stroke-width="3" />

  <!-- Berry Base Outline Shadow -->
  <path d="M 256 110 C 170 110 140 190 140 280 C 140 370 190 440 256 460 C 322 440 372 370 372 280 C 372 190 342 110 256 110 Z" fill="url(#berryGradient)" filter="url(#glow)" />

  <!-- Drupelets (Blackberry bumps) -->
  <!-- Row 1 -->
  <circle cx="210" cy="150" r="28" fill="url(#berryGradient)" stroke="#6b21a8" stroke-width="3" />
  <circle cx="256" cy="140" r="30" fill="url(#berryGradient)" stroke="#6b21a8" stroke-width="3" />
  <circle cx="302" cy="150" r="28" fill="url(#berryGradient)" stroke="#6b21a8" stroke-width="3" />

  <!-- Row 2 -->
  <circle cx="180" cy="195" r="32" fill="url(#berryGradient)" stroke="#581c87" stroke-width="3" />
  <circle cx="230" cy="190" r="34" fill="url(#berryGradient)" stroke="#581c87" stroke-width="3" />
  <circle cx="282" cy="190" r="34" fill="url(#berryGradient)" stroke="#581c87" stroke-width="3" />
  <circle cx="332" cy="195" r="32" fill="url(#berryGradient)" stroke="#581c87" stroke-width="3" />

  <!-- Row 3 -->
  <circle cx="160" cy="250" r="34" fill="url(#berryGradient)" stroke="#4c1d95" stroke-width="3" />
  <circle cx="210" cy="245" r="36" fill="url(#berryGradient)" stroke="#4c1d95" stroke-width="3" />
  <circle cx="260" cy="245" r="36" fill="url(#berryGradient)" stroke="#4c1d95" stroke-width="3" />
  <circle cx="310" cy="245" r="36" fill="url(#berryGradient)" stroke="#4c1d95" stroke-width="3" />
  <circle cx="352" cy="250" r="34" fill="url(#berryGradient)" stroke="#4c1d95" stroke-width="3" />

  <!-- Row 4 -->
  <circle cx="170" cy="310" r="34" fill="url(#berryGradient)" stroke="#3b0764" stroke-width="3" />
  <circle cx="220" cy="310" r="36" fill="url(#berryGradient)" stroke="#3b0764" stroke-width="3" />
  <circle cx="272" cy="310" r="36" fill="url(#berryGradient)" stroke="#3b0764" stroke-width="3" />
  <circle cx="322" cy="310" r="34" fill="url(#berryGradient)" stroke="#3b0764" stroke-width="3" />

  <!-- Row 5 Bottom -->
  <circle cx="200" cy="370" r="32" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />
  <circle cx="256" cy="375" r="34" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />
  <circle cx="312" cy="370" r="32" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />

  <!-- Bottom Tip -->
  <circle cx="230" cy="420" r="26" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />
  <circle cx="282" cy="420" r="26" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />
  <circle cx="256" cy="445" r="22" fill="url(#berryGradient)" stroke="#2e1065" stroke-width="3" />

  <!-- Highlights on drupelets -->
  <circle cx="202" cy="142" r="8" fill="url(#highlightGrad)" />
  <circle cx="248" cy="132" r="9" fill="url(#highlightGrad)" />
  <circle cx="294" cy="142" r="8" fill="url(#highlightGrad)" />
  <circle cx="172" cy="187" r="9" fill="url(#highlightGrad)" />
  <circle cx="222" cy="180" r="10" fill="url(#highlightGrad)" />
  <circle cx="274" cy="180" r="10" fill="url(#highlightGrad)" />
  <circle cx="152" cy="242" r="10" fill="url(#highlightGrad)" />
  <circle cx="202" cy="235" r="11" fill="url(#highlightGrad)" />
  <circle cx="162" cy="302" r="10" fill="url(#highlightGrad)" />
  <circle cx="212" cy="302" r="11" fill="url(#highlightGrad)" />
  <circle cx="192" cy="362" r="9" fill="url(#highlightGrad)" />
  <circle cx="248" cy="367" r="10" fill="url(#highlightGrad)" />

  <!-- AI Brain Circuits Over Top Half -->
  <g stroke="url(#aiBrainGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Left Brain Hemisphere Paths -->
    <path d="M 240 140 C 210 140 185 160 185 190 C 185 210 200 220 225 220 C 200 230 190 250 190 270 C 190 290 215 300 240 290" />
    <path d="M 215 165 C 230 180 235 200 210 210" />
    <path d="M 200 240 L 230 240" />

    <!-- Right Brain Hemisphere Paths -->
    <path d="M 272 140 C 302 140 327 160 327 190 C 327 210 312 220 287 220 C 312 230 322 250 322 270 C 322 290 297 300 272 290" />
    <path d="M 297 165 C 282 180 277 200 302 210" />
    <path d="M 312 240 L 282 240" />
  </g>

  <!-- Brain Circuit Nodes -->
  <g fill="#38bdf8">
    <circle cx="185" cy="190" r="5" />
    <circle cx="225" cy="220" r="5" />
    <circle cx="190" cy="270" r="5" />
    <circle cx="240" cy="140" r="5" />
    <circle cx="327" cy="190" r="5" />
    <circle cx="287" cy="220" r="5" />
    <circle cx="322" cy="270" r="5" />
    <circle cx="272" cy="140" r="5" />
  </g>

  <!-- Magnifying Glass with AI Leaf Symbol (On Right Side) -->
  <g transform="translate(40, 20)">
    <!-- Glass Handle -->
    <line x1="335" y1="335" x2="385" y2="385" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
    <line x1="335" y1="335" x2="385" y2="385" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" />

    <!-- Outer Rim -->
    <circle cx="290" cy="290" r="58" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="10" filter="url(#glow)" />
    <circle cx="290" cy="290" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" />

    <!-- AI Leaf / Chip Symbol Inside Glass -->
    <path d="M 290 255 C 315 255 325 280 325 305 C 325 320 305 325 290 325 C 275 325 255 320 255 305 C 255 280 265 255 290 255 Z" fill="none" stroke="#ffffff" stroke-width="4" />
    <line x1="290" y1="260" x2="290" y2="320" stroke="#ffffff" stroke-width="3" />
    <path d="M 290 280 L 308 270" stroke="#ffffff" stroke-width="3" />
    <path d="M 290 295 L 274 288" stroke="#ffffff" stroke-width="3" />
    <circle cx="308" cy="270" r="3" fill="#ffffff" />
    <circle cx="274" cy="288" r="3" fill="#ffffff" />
  </g>
</svg>
